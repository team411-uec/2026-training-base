<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えています（Tailwind は使っていません）。
      ここに CSS を足していくだけで、自由に装飾を拡張できます。
      ・各要素には class（例: omikuji-result）が付いているので狙いやすいです。
      ・[data-result="大吉"] のように、おみくじの結果ごとに装飾を変えることもできます
        （render.ts で結果を data-result 属性に入れた場合）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }

      /*
        ＜装飾の拡張例＞ 下のコメントを外すと、大吉のときだけ背景が変わります。
        （render.ts で el.dataset.result = result; を書いている必要があります）
        .omikuji-result[data-result="大吉"] {
          background-color: gold;
        }
      */
    </style>
  </head>

  <body>
    <h1>おみくじアプリ</h1>
    <p>「おみくじを引く」ボタンを押してみましょう。</p>

    <!--
      結果を表示する場所です。id="result" を render.ts から取得して書き換えます。
      最初は固定の文言が出ています（ステップ1を実装するまで、ここは変わりません）。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリックされたときの処理は main.ts で結びつけています。 -->
    <div class="omikuji-controls">
      <button id="draw-button">おみくじを引く</button>
      <button id="reset-button">リセット</button>
    </div>

    <!--
      ★拡張ポイント（HTML）：ステップ2以降で使う空きエリアです。
        ・残りくじ枚数を出したい → <div id="remaining"> を使う
        ・引いた履歴を出したい   → <ul id="history"> に <li> を足していく
      不要なうちはこのままでも、消してもかまいません。
    -->
    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込みます（Vite が自動で変換してくれます）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
